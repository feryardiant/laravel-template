name: PR Merged
run-name: 'merge(${{ github.event.pull_request.head.ref }}): prune images from `${{ github.event.pull_request.number }}`'

on:
  pull_request:
    types: [closed]

jobs:
  prune-images:
    name: Prune old images
    # Fork PRs get no secrets, and only same-repo PRs can push images.
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/prune-images.yml
    with:
      pr-number: ${{ github.event.pull_request.number }}
    secrets:
      PAT_PRUNE: ${{ secrets.PAT_PRUNE }}

    permissions:
      packages: read
