name: Prune Images

on:
  workflow_call:
    inputs:
      dry-run:
        description: Whether to dry run
        default: false
        type: boolean
      keep-branch-base:
        description: Number of image to keep on base branch
        default: 10
        type: number
      pr-number:
        description: PR whose images may be deleted; every branch is pruned when empty
        default: ''
        type: string
    secrets:
      PAT_PRUNE:
        description: Token with packages delete permission; pruning is skipped when unset
        required: false
  workflow_dispatch:
    inputs:
      # A manual run is usually an inspection; flip this to actually delete.
      dry-run:
        description: Whether to dry run
        default: true
        type: boolean
      keep-branch-base:
        description: Number of image to keep on base branch
        default: 10
        type: number
      pr-number:
        description: PR whose images may be deleted; every branch is pruned when empty
        default: ''
        type: string

jobs:
  prune-images:
    name: Prune old images
    runs-on: ubuntu-latest

    permissions:
      packages: read

    # `secrets` is not available in `if`, so the presence check goes through `env`
    env:
      PAT_PRUNE: ${{ secrets.PAT_PRUNE }}

    steps:
      - name: Check token
        if: env.PAT_PRUNE == ''
        run: echo "::notice title=Prune images skipped::No PAT_PRUNE secret is set for this repository."

      - name: Prune old images
        if: env.PAT_PRUNE != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          DRY_RUN: ${{ inputs.dry-run && 1 }}
          KEEP_BASE_BRANCH: ${{ inputs.keep-branch-base }}
          PR_NUMBER: ${{ inputs.pr-number }}
        with:
          github-token: ${{ secrets.PAT_PRUNE }}
          script: |
            const { owner, repo } = context.repo;
            const registry = 'ghcr.io';
            const base_branch = process.env.BASE_BRANCH;
            const keep_branch_base = Number(process.env.KEEP_BASE_BRANCH);
            const pr_number = process.env.PR_NUMBER ?? '';
            const dry_run = process.env.DRY_RUN === '1';
            const deletion = { success: 0, error: 0 };

            // The package APIs are owner-scoped: with a token from another account
            // the authenticated-user endpoints resolve that account's namespace.
            const is_org = context.payload.repository?.owner?.type === 'Organization';
            const owner_param = is_org ? 'org' : 'username';

            /**
             * @link https://octokit.github.io/rest.js/v22/#packages-get-all-package-versions-for-a-package-owned-by-the-authenticated-user
             */
            const list_versions = async () => {
              const all = [];

              for (let page = 1; ; page++) {
                const list = is_org
                  ? github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg
                  : github.rest.packages.getAllPackageVersionsForPackageOwnedByUser;

                const { data } = await list({
                  [owner_param]: owner,
                  package_type: 'container',
                  package_name: repo,
                  per_page: 100,
                  page,
                });

                all.push(...data);

                if (data.length < 100) break;
              }

              return all;
            };

            // A fresh repository from this template has no image yet, and a token
            // without access sees nothing either; neither should fail the run.
            let versions;

            try {
              versions = await list_versions();
            } catch (error) {
              core.warning(`Unable to list container package versions, skipping prune: ${error.message}`);
              return;
            }

            // Newest first, so `slice()` below drops the oldest builds
            versions.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            const tags_of = (version) => version.metadata?.container?.tags ?? [];

            // `dist` tags a main build as `<branch>.<sha8>` and a PR build as
            // `pr-<n>` (moving) plus `pr-<n>.<sha40>` (per build). Release builds
            // take their tag from the git tag or the `chore(release):` commit
            // title, and the platform/attestation manifests of a multi-arch image
            // carry no tag at all.
            const pr_tag = (tag) => /^pr-\d+$/.test(tag);

            const build_tag = (version) =>
              tags_of(version).find(pr_tag) ??
              tags_of(version).find((tag) => /^(pr\d+-)?(\d+\.\d+\.\d+-)?[\w-]+\.[a-f0-9]{7,40}$/.test(tag));

            const branch_of = (tag) =>
              pr_tag(tag) ? tag : tag.replace(/^(pr\d+-)?(\d+\.\d+\.\d+-)?(.*)\.[a-f0-9]{7,40}$/, '$3').trim();

            const branches = new Map([[base_branch, []]]);
            for (const version of versions) {
              const tag = build_tag(version);
              if (!tag) continue;

              const branch = branch_of(tag);
              branches.set(branch, [...(branches.get(branch) ?? []), version]);
            }

            // Delete every branch but the base one, and all but the newest
            // `keep_branch_base` base builds. When the caller names a PR, only that
            // PR's images go: a merge must not remove another open PR's preview.
            const to_delete = [];
            for (const [branch, list] of branches) {
              if (branch === base_branch) {
                to_delete.push(...list.slice(keep_branch_base));
              } else if (!pr_number || branch === `pr-${pr_number}`) {
                to_delete.push(...list);
              }
            }

            /**
             * Untagged versions are the amd64/arm64 and attestation manifests of a
             * multi-arch push. Deleting one breaks the index that lists it, so only
             * drop the ones no surviving version references.
             */
            const resolve_orphans = async () => {
              // Same credentials `docker/login-action` uses to push in `dist.yml`
              const basic = Buffer.from(`${owner}:${process.env.GH_TOKEN}`).toString('base64');
              const { token } = await fetch(
                `https://${registry}/token?scope=repository:${owner}/${repo}:pull&service=${registry}`,
                { headers: { authorization: `Basic ${basic}` } },
              ).then((response) => response.json());

              const get_manifest = async (digest) => {
                const response = await fetch(`https://${registry}/v2/${owner}/${repo}/manifests/${digest}`, {
                  headers: {
                    authorization: `Bearer ${token}`,
                    accept: [
                      'application/vnd.oci.image.index.v1+json',
                      'application/vnd.docker.distribution.manifest.list.v2+json',
                      'application/vnd.oci.image.manifest.v1+json',
                    ].join(', '),
                  },
                });

                if (!response.ok) throw new Error(`${digest}: ${response.status} ${response.statusText}`);

                return response.json();
              };

              const deleted = new Set(to_delete.map((version) => version.id));
              const referenced = new Set();

              for (const version of versions) {
                if (deleted.has(version.id) || tags_of(version).length === 0) continue;

                const { manifests = [] } = await get_manifest(version.name);
                for (const manifest of manifests) referenced.add(manifest.digest);
              }

              const now = Date.now();
              // A push publishes its platform manifests before the index that lists
              // them, so a version this young may be referenced by an index that
              // does not exist in this snapshot yet.
              const grace_ms = 30 * 60 * 1000;

              return versions.filter(
                (v) =>
                  tags_of(v).length === 0 &&
                  !referenced.has(v.name) &&
                  now - new Date(v.created_at).getTime() > grace_ms,
              );
            };

            let orphans = [];

            try {
              orphans = await resolve_orphans();
            } catch (error) {
              // Keeping orphans costs storage; deleting a referenced manifest breaks
              // the image, so leave untagged versions alone when resolution fails.
              core.warning(`Unable to resolve untagged manifests, skipping them: ${error.message}`);
            }

            if (to_delete.length === 0 && orphans.length === 0) {
              core.notice('No images to delete');
              return;
            }

            const delete_pkg = async (pkg) => {
              const tags = tags_of(pkg).length > 0 ? tags_of(pkg).join('\u001b[0m,\u001b[33m') : pkg.name;

              try {
                if (!dry_run) {
                  const remove = is_org
                    ? github.rest.packages.deletePackageVersionForOrg
                    : github.rest.packages.deletePackageVersionForUser;

                  /**
                   * @link https://octokit.github.io/rest.js/v22/#packages-delete-package-version-for-a-package-owned-by-the-authenticated-user
                   */
                  await remove({
                    [owner_param]: owner,
                    package_type: 'container',
                    package_name: repo,
                    package_version_id: pkg.id,
                  });
                }

                core.info(`- \u001b[33m${pkg.id}\u001b[0m: \u001b[33m${tags}\u001b[0m`);
                deletion.success++;
              } catch (error) {
                core.warning(`Unable to delete package \u001b[33m${pkg.id}\u001b[0m: ${error.message}`);
                deletion.error++;
              }
            };

            core.info(`\u001b[1mDelete images:\u001b[0m${dry_run ? ' [dry run]' : ''}`);
            await Promise.all(to_delete.map(delete_pkg));

            // The manifests only become orphans once their index is gone; when a
            // delete fails the index may still list them, so keep them for a rerun.
            let orphans_attempted = false;

            if (orphans.length > 0) {
              if (deletion.error > 0) {
                core.warning(
                  `Skipping \u001b[33m${orphans.length}\u001b[0m untagged manifest(s): ` +
                    'a tagged delete failed, so their index may still list them',
                );
              } else {
                orphans_attempted = true;
                await Promise.all(orphans.map(delete_pkg));
              }
            }

            core.notice(
              [
                `From \u001b[1m${to_delete.length + (orphans_attempted ? orphans.length : 0)}\u001b[0m images:`,
                `\u001b[32m${deletion.success}\u001b[0m deleted and`,
                `\u001b[31m${deletion.error}\u001b[0m error`,
              ].join(' '),
            );
