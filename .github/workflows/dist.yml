name: Distribute
run-name: 'dist(${{ github.event.workflow_run.head_branch || github.head_ref }}): docker build for `${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}`'

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/dist.yml
      - scripts/docker/**
  workflow_run:
    branches: [main]
    types: [completed]
    workflows: [Tests]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare
    if: >-
      github.event_name != 'pull_request'
        && github.event.workflow_run.conclusion == 'success'
        || github.event.pull_request.head.repo.full_name == github.repository
    uses: projek-xyz/actions/.github/workflows/prepare.yml@b8889b2415c01ca846b5865dcbacbed0439cff06 # main @ 2026-11-13
    with:
      project-ref: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
      php-version: ${{ vars.PHP_VERSION || '8.4' }}
    permissions:
      contents: read
      pull-requests: write

  docker:
    name: Build and Push
    runs-on: ubuntu-latest
    # A failed Tests run must not publish an image.
    if: github.event_name == 'pull_request' || github.event.workflow_run.conclusion == 'success'
    needs: [prepare]

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true

      - name: Build Frontend
        env:
          APP_URL: ${{ vars.APP_URL || 'http://localhost' }}
          LARAVEL_BYPASS_ENV_CHECK: 1
        run: vp build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ needs.prepare.outputs.project-repo-name }}
          labels: |
            org.opencontainers.image.author=${{ github.repository_owner }}
            org.opencontainers.image.licenses=MIT
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.prepare.outputs.project-version }}
            type=raw,value=${{ needs.prepare.outputs.branch-slug }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=,format=long

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          build-args: |
            BASE_OS=${{ vars.BASE_OS || 'alpine' }}
            BASE_VERSION=${{ vars.BASE_VERSION || '3.24' }}
            PHP_VERSION=${{ vars.PHP_VERSION || '8.4' }}
          context: .
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: scripts/docker/staging/Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          push: true

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: github.event_name == 'workflow_run'
        with:
          subject-name: ghcr.io/${{ needs.prepare.outputs.project-repo-name }}
          subject-digest: ${{ steps.push.outputs.digest }}
