name: Distribute
run-name: 'dist(${{ github.event.workflow_run.head_branch }}): docker build for `${{ github.event.workflow_run.head_sha }}`'

on:
  workflow_run:
    types: [completed]
    workflows: [Tests]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  # A failed upstream run must not cancel a publication in flight for another
  # commit: it would then skip at `prepare` and neither commit gets published.
  cancel-in-progress: ${{ github.event.workflow_run.conclusion == 'success' }}

jobs:
  prepare:
    name: Prepare
    # A failed Tests run must not publish an image, and fork PRs must not publish
    # at all — `workflow_run` hands this workflow a write token regardless.
    if: >-
      github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.head_repository.full_name == github.repository
    uses: projek-xyz/actions/.github/workflows/prepare.yml@8bd9a16148098eae66a52c863b90b9cb0dcdc34d # main @ 2026-11-20
    with:
      project-ref: ${{ github.event.workflow_run.head_sha }}
      php-version: ${{ vars.PHP_VERSION || '8.4' }}
    permissions:
      contents: read
      pull-requests: write

  docker:
    name: Build and Push
    runs-on: ubuntu-latest
    needs: [prepare]

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    env:
      PHP_VERSION: ${{ vars.PHP_VERSION || '8.4' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: xdebug

      - name: Composer Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ needs.prepare.outputs.composer-cache-dir }}
          key: php${{ env.PHP_VERSION }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: php${{ env.PHP_VERSION }}-composer-

      - name: Install
        run: |
          composer install --no-interaction --no-progress --ansi

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true

      - name: Build Frontend
        env:
          APP_URL: ${{ vars.APP_URL || 'http://localhost' }}
          LARAVEL_BYPASS_ENV_CHECK: 1
        run: vp build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ needs.prepare.outputs.project-repo-name }}
          labels: |
            org.opencontainers.image.title=${{ needs.prepare.outputs.project-repo-name }}
            org.opencontainers.image.description=${{ github.event.repository.description }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}
            org.opencontainers.image.authors=${{ github.repository_owner }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.licenses=${{ github.event.repository.license.spdx_id || 'MIT' }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.project-version }}
          tags: |
            # `workflow_run` runs on the default branch ref, so every tag is keyed
            # off the upstream event instead of `github.ref`/`GITHUB_SHA`.
            type=raw,value=${{ github.event.workflow_run.head_sha }}
            type=raw,value=latest,enable=${{ github.event.workflow_run.event == 'push' }}
            type=raw,value=${{ github.event.workflow_run.head_branch }},enable=${{ github.event.workflow_run.event == 'push' }}
            type=raw,value=${{ needs.prepare.outputs.project-version }},enable=${{ github.event.workflow_run.event == 'push' }}
            type=raw,value=pr-${{ github.event.workflow_run.pull_requests[0].number }},enable=${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0].number != null }}
            # Immutable per-build tag: `pr-<n>` moves to the next build, leaving the
            # previous one unrecognisable to the prune.
            type=raw,value=pr-${{ github.event.workflow_run.pull_requests[0].number }}.${{ github.event.workflow_run.head_sha }},enable=${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0].number != null }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          build-args: |
            BASE_OS=${{ vars.BASE_OS || 'alpine' }}
            BASE_VERSION=${{ vars.BASE_VERSION || '3.24' }}
            PHP_VERSION=${{ env.PHP_VERSION }}
          context: .
          cache-from: type=gha
          # A `workflow_run` of a pull request gets a read-only cache token, and a
          # failed export fails the build before the index is pushed.
          cache-to: ${{ github.event.workflow_run.event == 'push' && 'type=gha,mode=max' || '' }}
          file: scripts/docker/staging/Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          push: true

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: github.event.workflow_run.event == 'push'
        with:
          subject-name: ghcr.io/${{ needs.prepare.outputs.project-repo-name }}
          subject-digest: ${{ steps.push.outputs.digest }}
